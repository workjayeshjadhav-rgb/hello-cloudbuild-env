steps:
# -----------------------------------------------------------------------------
# STEP 1: Deploy to GKE (Apply kubernetes.yaml)
# -----------------------------------------------------------------------------
- name: 'gcr.io/cloud-builders/kubectl'
  id: Deploy
  args:
    - 'apply'
    - '-f'
    - 'kubernetes.yaml'
  env:
    - 'CLOUDSDK_COMPUTE_REGION=us-west1'
    - 'CLOUDSDK_CONTAINER_CLUSTER=hello-cloudbuild'

# -----------------------------------------------------------------------------
# STEP 2: Copy kubernetes.yaml into the production branch
# -----------------------------------------------------------------------------
- name: 'gcr.io/cloud-builders/git'
  id: Copy to production branch
  entrypoint: /bin/sh
  args:
    - '-c'
    - |
      set -x

      # Configure Git identity
      git config user.email "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
      git config user.name "Cloud Build"

      # Fetch the production branch
      git fetch origin production

      # Switch to production branch
      git checkout production

      # Copy the kubernetes.yaml from the candidate commit
      git checkout $COMMIT_SHA -- kubernetes.yaml

      # Commit changes
      git add kubernetes.yaml
      git commit -m "Deploy manifest from commit $COMMIT_SHA"

      # Push to production branch
      git push origin production

options:
  logging: CLOUD_LOGGING_ONLY
